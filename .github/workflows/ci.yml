name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javac:
    name: javac build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        run: ./build.sh build
      - name: Java unit tests
        run: ./build.sh test
      - name: Python unit tests
        run: python3 -m unittest discover -s tests/python -v
      - name: State listener end-to-end test
        run: bash tests/e2e/run_state_listener_test.sh
      - name: Proxy end-to-end test
        run: bash tests/e2e/run_proxy_test.sh

  maven:
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and package
        run: mvn -B -q package

  gradle:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and check
        run: gradle --no-daemon build
