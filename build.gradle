plugins {
    id 'application'
}

group = 'com.blurpsuite'
version = '1.0.0'

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    // Older Gradle versions do not understand source compatibility 17, so the
    // release flag is also passed directly to javac.
    options.compilerArgs += ['--release', '17']
}

// Gradle 4.x exposes the application plugin's main class as a project property;
// Gradle 8.x configures it through the application extension.
if (properties.containsKey('application')) {
    application {
        mainClass = 'com.blurpsuite.Main'
    }
} else {
    mainClassName = 'com.blurpsuite.Main'
}

sourceSets {
    main {
        java {
            // Includes src/main/java/burp, generated by tools/generate_burp_api.py
            // from tools/api-contract.json (published Javadoc signatures only).
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            // The dependency-free tests are kept in tests/java. src/test/java is
            // also accepted for future conventional test sources.
            srcDirs = ['tests/java', 'src/test/java']
        }
    }
}

task unitTests(type: JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free Java TestRunner from tests/java (Python tests use pythonTests).'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    // Gradle 4.x uses main; Gradle 8.x uses mainClass.
    if (properties.containsKey('mainClass')) {
        mainClass = 'com.blurpsuite.tests.TestRunner'
    } else {
        main = 'com.blurpsuite.tests.TestRunner'
    }
}

task pythonTests(type: Exec) {
    group = 'verification'
    // python3 -m unittest discover -s tests/python -v, run from the project root.
    description = 'Runs the Python bridge unit tests from tests/python with unittest.'
    workingDir projectDir
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tests/python', '-v'
}

test {
    // There is no JUnit dependency in this project: TestRunner is the actual
    // Java test task and pythonTests runs the Python bridge unit tests.
    // Disabling Gradle's framework-based Test task avoids looking for JUnit
    // provider classes that are intentionally not present.
    dependsOn 'unitTests', 'pythonTests'
    enabled = false
}

task e2eStateListener(type: Exec) {
    group = 'verification'
    description = 'Runs tests/e2e/run_state_listener_test.sh (Java + Python state listeners).'
    dependsOn 'classes'
    commandLine 'bash', "${projectDir}/tests/e2e/run_state_listener_test.sh"
}

task e2eProxy(type: Exec) {
    group = 'verification'
    description = 'Runs tests/e2e/run_proxy_test.sh (proxy forwarding with Java + Python extensions).'
    dependsOn 'classes'
    commandLine 'bash', "${projectDir}/tests/e2e/run_proxy_test.sh"
}

task e2e {
    group = 'verification'
    // Runs both e2e scripts: tests/e2e/run_state_listener_test.sh and tests/e2e/run_proxy_test.sh.
    description = 'Runs both end-to-end tests: state listener and proxy.'
    dependsOn 'e2eStateListener', 'e2eProxy'
}

check {
    // Verification covers Java and Python unit tests plus both e2e scripts.
    dependsOn 'e2e'
}
